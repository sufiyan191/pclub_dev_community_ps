name: SpatialDev CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies & Syntax Check
        working-directory: ./server
        run: |
          npm install
          node --check src/index.js

      - name: Install & Build Next.js Spatial Frontend
        working-directory: ./client
        run: |
          npm install
          npm run build